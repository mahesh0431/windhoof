<!doctype html>
<html lang="en" data-longride="loading">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Longride - ride a wild horse across an island, at your own pace."
    />
    <title>Longride</title>
  </head>
  <body>
    <!--
      role="application" tells assistive technology to pass keystrokes through
      rather than intercepting them for browse mode, which is what an
      interactive 3D view needs. role="img" would describe it as a static
      picture and swallow the controls.
    -->
    <canvas
      id="longride-canvas"
      role="application"
      tabindex="0"
      aria-label="Longride. Ride with W A S D, turn with A and D, hold Shift to gallop, press Escape to pause."
    ></canvas>
    <div id="longride-ui"></div>
    <noscript>
      <div class="lr-noscript">
        <p>Longride is a browser game and needs JavaScript and WebGL 2 to run.</p>
      </div>
    </noscript>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
